name: SSMT Verify

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify-ssmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run verification script
        run: |
          python ssmt_verify.py
